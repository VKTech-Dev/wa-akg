services:
  db:
    image: mysql:8.0
    container_name: wa-akg-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wa_akg}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - ./dados/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-akg-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3005}:3000"
    environment:
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE:-wa_akg}
      - AUTH_SECRET=${AUTH_SECRET}
      - BASE_URL=${BASE_URL:-http://127.0.0.1:3005}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://127.0.0.1:3005}
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=${BASE_URL:-http://127.0.0.1:3005}
      - NEXT_PUBLIC_API_URL=${BASE_URL:-http://127.0.0.1:3005}/api
      - BAILEYS_LOG_LEVEL=${BAILEYS_LOG_LEVEL:-error}
      - NEXT_PUBLIC_SWAGGER_USERNAME=${NEXT_PUBLIC_SWAGGER_USERNAME:-admin}
      - NEXT_PUBLIC_SWAGGER_PASSWORD=${NEXT_PUBLIC_SWAGGER_PASSWORD:-admin123}
      - NEXT_PUBLIC_SWAGGER_ENABLED=${NEXT_PUBLIC_SWAGGER_ENABLED:-true}
      - TZ=${TZ:-America/Sao_Paulo}
      - LOCALE=${LOCALE:-pt-BR}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-pt-BR}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./dados/data:/app/data
      - ./dados/uploads:/app/uploads
